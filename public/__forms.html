<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>FlyFund forms</title>
  </head>
  <body>
    <!--
      Build-time registration for Netlify Forms. Never shown to visitors.
      Field names must match src/components/ApplyForm.tsx and ContactForm.tsx.
      The React forms POST to /__forms.html.
    -->
    <form name="apply" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="apply" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="country" />
      <input type="text" name="referral" />
      <input type="text" name="submitted_at" />
      <input name="bot-field" />
    </form>

    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="country" />
      <textarea name="message"></textarea>
      <input type="text" name="submitted_at" />
      <input name="bot-field" />
    </form>
  </body>
</html>
